openapi: 3.0.3
info:
  title: RoomFlow API
  version: 1.0.0
  contact:
    name: RoomFlow Team
  description: |-
    RoomFlow 会议室预约管理系统 REST API 契约（OpenAPI 3.0.3）。

    本文件是前后端唯一共享契约：后端 Controller 与前端 api/types 均以此为准。
    配套说明文档（错误码表、分页约定、权限矩阵、时区约定）见 `docs/api/README.md`。

    通用约定：
    - 统一响应体 `Result<T>`：`{code:int, message:string, data:T}`。`code=0` 成功；非 0 为业务错误码，同时携带匹配的 HTTP 状态码。
    - 时间：全部时间字段（请求与响应）均为北京时间，ISO 8601 格式且必须显式携带 `+08:00` 偏移，例：`2026-09-16T14:00:00+08:00`。`format: date` 的查询参数为北京时间日历日 `YYYY-MM-DD`。
    - 会议时段为 `[startTime, endTime)` 半开区间；同一房间的相邻时段允许首尾相接（前一会的 endTime 可等于后一会的 startTime）。
    - 时间规则：`startTime` 不得早于当前时间、不得晚于当前时间 +72h（滚动窗口只约束开始时间）；`startTime` 与 `endTime` 均须按 15 分钟对齐（秒=0 且分钟 %15=0）；时长为 15min–24h（含两端）；允许跨天；`endTime` 可超出 72h 预约窗口。
    - 权限：每个端点以 `x-permission` 标注，取值 `PUBLIC`（无需登录）/ `REFRESH_TOKEN`（仅凭请求体中的 Refresh Token）/ `AUTHENTICATED`（任意已登录用户）/ `ADMIN` / `ORGANIZER_OR_ADMIN`（会议发起人或管理员）/ `SELF`（仅操作本人资源）。全局默认要求 Bearer JWT；公开端点显式声明 `security: []`。
    - 每个端点可能返回的业务错误码以 `x-error-codes` 枚举，与 README 错误码表一一对应。
    - 分页：`page`（从 1 起）/ `size`（默认 10，最大 100），分页响应为 `PageResult<T> = {records, total, page, size}`。
servers:
  - url: http://localhost:8080
    description: 本地开发环境
tags:
  - name: auth
    description: 认证：注册 / 登录 / 退出 / 刷新 / 当前用户
  - name: rooms
    description: 会议室：查询与 ADMIN 管理
  - name: meetings
    description: 会议：创建 / 查询 / 修改 / 取消 / 删除 / 提前结束
  - name: participants
    description: 报名：报名 / 退出 / 踢人 / 参会者查询
  - name: notifications
    description: 站内通知：查询 / 标记已读
security:
  - bearerAuth: []
paths:
  /api/auth/register:
    post:
      tags:
        - auth
      operationId: register
      summary: 用户注册
      description: |-
        用户名 + 密码注册。用户名全局唯一（不区分大小写与否由服务端统一存储决定，契约要求按原样唯一）。
        注册成功即视为登录，直接返回 Access Token 与 Refresh Token。
        冲突时返回 409 + code=40901。
      security: []
      x-permission: PUBLIC
      x-error-codes: [40001, 40002, 40901, 50000]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAuthTokenVO'
              example:
                code: 0
                message: success
                data:
                  tokenType: Bearer
                  accessToken: <ACCESS_TOKEN>
                  accessTokenExpiresIn: 1800
                  refreshToken: <REFRESH_TOKEN>
                  refreshTokenExpiresIn: 2592000
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/login:
    post:
      tags:
        - auth
      operationId: login
      summary: 用户登录
      description: |-
        用户名 + 密码登录，返回 Access Token 与 Refresh Token。
        用户名或密码错误统一返回 401 + code=40103（不区分是用户名不存在还是密码错误，防止枚举）。
        账号被禁用（status=0）返回 403 + code=40302。
      security: []
      x-permission: PUBLIC
      x-error-codes: [40001, 40002, 40103, 40302, 50000]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAuthTokenVO'
              example:
                code: 0
                message: success
                data:
                  tokenType: Bearer
                  accessToken: <ACCESS_TOKEN>
                  accessTokenExpiresIn: 1800
                  refreshToken: <REFRESH_TOKEN>
                  refreshTokenExpiresIn: 2592000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      tags:
        - auth
      operationId: logout
      summary: 退出登录
      description: |-
        退出当前会话：撤销当前 Access Token 对应的会话及其 Refresh Token（服务端会话存储中删除）。
        无请求体。幂等：对同一 Token 重复退出仍返回 200（Token 已撤销按未认证处理时为 401）。
      x-permission: AUTHENTICATED
      x-error-codes: [40101, 40102, 50000]
      responses:
        '200':
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
              example:
                code: 0
                message: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/refresh:
    post:
      tags:
        - auth
      operationId: refreshToken
      summary: 刷新 Token
      description: |-
        使用请求体中的 Refresh Token 换取新的 Token 对（Refresh Token 轮换：旧 Refresh Token 立即失效）。
        本端点不使用 Bearer 头认证，凭证为请求体中的 refreshToken。
        Refresh Token 无效、已撤销或已过期返回 401 + code=40104。
      security: []
      x-permission: REFRESH_TOKEN
      x-error-codes: [40001, 40002, 40104, 50000]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 刷新成功，返回新 Token 对
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAuthTokenVO'
              example:
                code: 0
                message: success
                data:
                  tokenType: Bearer
                  accessToken: <ACCESS_TOKEN>
                  accessTokenExpiresIn: 1800
                  refreshToken: <ROTATED_REFRESH_TOKEN>
                  refreshTokenExpiresIn: 2592000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/me:
    get:
      tags:
        - auth
      operationId: getCurrentAccount
      summary: 当前登录用户信息
      description: 返回当前 Bearer Token 对应的账号信息（脱敏，不含 password_hash）。
      x-permission: AUTHENTICATED
      x-error-codes: [40101, 40102, 50000]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAccountVO'
              example:
                code: 0
                message: success
                data:
                  id: 1001
                  username: alice
                  role: USER
                  status: 1
                  createdAt: '2026-09-15T10:00:00+08:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/rooms:
    get:
      tags:
        - rooms
      operationId: listRooms
      summary: 会议室列表
      description: |-
        返回全部会议室（含已停用），按 id 升序，不分页（房间是少量有限资源）。
        可选 `enabled` 筛选启用状态；缺省返回全部。
      x-permission: AUTHENTICATED
      x-error-codes: [40001, 40101, 40102, 50000]
      parameters:
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
          description: 按启用状态筛选；true=仅启用，false=仅停用，缺省=全部
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultRoomVOList'
              example:
                code: 0
                message: success
                data:
                  - id: 1
                    name: 301会议室
                    location: 3楼东侧
                    capacity: 8
                    equipment: [PROJECTOR, WHITEBOARD]
                    enabled: true
                    createdAt: '2026-09-15T09:00:00+08:00'
                    updatedAt: '2026-09-15T09:00:00+08:00'
                  - id: 2
                    name: 302会议室
                    location: 3楼西侧
                    capacity: 12
                    equipment: [PROJECTOR, VIDEO_CONFERENCE]
                    enabled: true
                    createdAt: '2026-09-15T09:00:00+08:00'
                    updatedAt: '2026-09-15T09:00:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - rooms
      operationId: createRoom
      summary: 创建会议室
      description: 创建会议室，enabled 默认为 true。仅 ADMIN。
      x-permission: ADMIN
      x-error-codes: [40001, 40002, 40101, 40102, 40301, 50000]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultRoomVO'
              example:
                code: 0
                message: success
                data:
                  id: 4
                  name: 多功能厅B
                  location: 5楼
                  capacity: 20
                  equipment: [PROJECTOR, WHITEBOARD, VIDEO_CONFERENCE, PHONE]
                  enabled: true
                  createdAt: '2026-09-15T14:00:00+08:00'
                  updatedAt: '2026-09-15T14:00:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/rooms/{id}:
    get:
      tags:
        - rooms
      operationId: getRoom
      summary: 会议室详情
      description: 按 ID 查询会议室（含已停用房间）。
      x-permission: AUTHENTICATED
      x-error-codes: [40001, 40101, 40102, 40401, 50000]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultRoomVO'
              example:
                code: 0
                message: success
                data:
                  id: 1
                  name: 301会议室
                  location: 3楼东侧
                  capacity: 8
                  equipment: [PROJECTOR, WHITEBOARD]
                  enabled: true
                  createdAt: '2026-09-15T09:00:00+08:00'
                  updatedAt: '2026-09-15T09:00:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - rooms
      operationId: updateRoom
      summary: 修改会议室
      description: |-
        全量更新会议室信息（PUT 语义）。仅 ADMIN。
        location、equipment 省略时分别视为 null、空数组。
        注意：本端点不修改 enabled，启停请使用 PATCH /api/rooms/{id}/status。
      x-permission: ADMIN
      x-error-codes: [40001, 40002, 40101, 40102, 40301, 40401, 50000]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultRoomVO'
              example:
                code: 0
                message: success
                data:
                  id: 1
                  name: 301会议室（翻新版）
                  location: 3楼东侧
                  capacity: 10
                  equipment: [PROJECTOR, WHITEBOARD, PHONE]
                  enabled: true
                  createdAt: '2026-09-15T09:00:00+08:00'
                  updatedAt: '2026-09-15T15:00:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - rooms
      operationId: deleteRoom
      summary: 停用会议室（软删除）
      description: |-
        软删除会议室：将 enabled 置为 false，不物理删除行，保留历史会议的 room_id 关联完整性。
        停用时校验：若该房间存在 status=ACTIVE 的未结束会议，拒绝并返回 409 + code=40907，需先处理相关会议。
        幂等：对已停用房间重复调用返回 200。仅 ADMIN。
      x-permission: ADMIN
      x-error-codes: [40001, 40101, 40102, 40301, 40401, 40907, 50000]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 停用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
              example:
                code: 0
                message: success
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/rooms/{id}/status:
    patch:
      tags:
        - rooms
      operationId: updateRoomStatus
      summary: 启用 / 停用会议室
      description: |-
        设置 enabled 标志。仅 ADMIN。
        enabled=false（停用）时校验：存在 status=ACTIVE 的未结束会议则拒绝（409 + code=40907）。
        enabled=true（启用）无附加校验。
      x-permission: ADMIN
      x-error-codes: [40001, 40002, 40101, 40102, 40301, 40401, 40907, 50000]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomStatusRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultRoomVO'
              example:
                code: 0
                message: success
                data:
                  id: 1
                  name: 301会议室
                  location: 3楼东侧
                  capacity: 8
                  equipment: [PROJECTOR, WHITEBOARD]
                  enabled: false
                  createdAt: '2026-09-15T09:00:00+08:00'
                  updatedAt: '2026-09-15T16:00:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/rooms/{id}/availability:
    get:
      tags:
        - rooms
      operationId: getRoomAvailability
      summary: 查询房间占用时段
      description: |-
        返回指定房间在指定北京时间日历日范围内、与范围有交集的全部 status=ACTIVE 会议占用时段
        （`occupiedSlots`，按 startTime 升序），由前端用“日期范围 − 占用时段”计算空闲时段。
        设计理由：只暴露已占用时段这一事实数据，空闲区间的生成规则（粒度、边界）由前端决定，
        避免前后端对“空闲段”边界定义不一致。
        已停用房间（enabled=false）仍可查询其占用时段（历史会议保留关联）。
        缺少必填查询参数 startDate 时返回 400 + code=40002。
      x-permission: AUTHENTICATED
      x-error-codes: [40001, 40002, 40101, 40102, 40401, 50000]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
          description: 范围起始日，北京时间日历日 YYYY-MM-DD
          example: '2026-09-16'
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 范围结束日（含），北京时间日历日；缺省=startDate；不得早于 startDate 且跨度 ≤ 7 天，否则 40001
          example: '2026-09-16'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultRoomAvailabilityVO'
              example:
                code: 0
                message: success
                data:
                  roomId: 1
                  startDate: '2026-09-16'
                  endDate: '2026-09-16'
                  occupiedSlots:
                    - meetingId: 101
                      startTime: '2026-09-16T10:00:00+08:00'
                      endTime: '2026-09-16T11:30:00+08:00'
                    - meetingId: 102
                      startTime: '2026-09-16T14:00:00+08:00'
                      endTime: '2026-09-16T15:00:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/meetings:
    get:
      tags:
        - meetings
      operationId: listMeetings
      summary: 会议列表
      description: |-
        分页查询会议列表，按 startTime DESC、id DESC 排序。
        任何情况下都不返回 status=DELETED 的会议（对普通用户与 ADMIN 均不可见）。
        筛选参数可组合：
        - roomId：按房间筛选；
        - date：返回与该北京时间日历日有交集的会议（含跨天会议）；
        - status：按 ACTIVE/ENDED/CANCELLED 筛选（不可筛选 DELETED）；
        - onlyMine=true：仅返回“当前用户为发起人，或当前用户存在有效参会记录（leftAt 为 null）”的会议。
      x-permission: AUTHENTICATED
      x-error-codes: [40001, 40101, 40102, 50000]
      parameters:
        - $ref: '#/components/parameters/QueryPage'
        - $ref: '#/components/parameters/QuerySize'
        - name: roomId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
          description: 按房间 ID 筛选
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 按北京时间日历日筛选，返回与该日有交集的会议
          example: '2026-09-16'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MeetingStatusFilter'
          description: 按会议状态筛选
        - name: onlyMine
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: true 时仅返回我发起或我正在参与（leftAt 为 null）的会议
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPageMeetingVO'
              example:
                code: 0
                message: success
                data:
                  records:
                    - id: 101
                      title: 产品评审会
                      description: Q3 需求评审
                      roomId: 1
                      roomName: 301会议室
                      organizerId: 1001
                      organizerUsername: alice
                      startTime: '2026-09-16T10:00:00+08:00'
                      endTime: '2026-09-16T11:30:00+08:00'
                      status: ACTIVE
                      endedEarly: false
                      participantCount: 3
                      createdAt: '2026-09-15T12:00:00+08:00'
                      updatedAt: '2026-09-15T12:00:00+08:00'
                  total: 1
                  page: 1
                  size: 10
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - meetings
      operationId: createMeeting
      summary: 创建会议
      description: |-
        创建会议，创建者自动成为发起人（自动写入 is_organizer=1 的参会记录，占 1 个名额）。
        服务端按顺序校验（任一失败即返回对应错误码）：
        1. 字段格式校验 → 40001；
        2. 时间规则（未来 72h 内开始、15min 对齐、时长 15min–24h）→ 40905；
