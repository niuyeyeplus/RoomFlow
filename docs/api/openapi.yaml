        修改会议信息（PUT 语义，提交完整字段）。仅发起人或 ADMIN。
        规则：
        - 会议不存在或 status=DELETED 返回 40401（与其他端点口径一致，不暴露删除痕迹）；
          status 为 ENDED/CANCELLED 返回 40909；
        - 未开始的会议（status=ACTIVE 且 startTime > now）可修改全部字段：新时间须通过全部时间规则（40905），
          新房间须存在且已启用（40401/40906），同房间 `[start,end)` 冲突检测排除本会议自身（40902），
          新房间 capacity 不得小于当前有效参会人数（40903）；
        - 已开始的会议（status=ACTIVE 且 startTime <= now，含已过 endTime 但调度任务尚未结束的 ACTIVE 会议）
          仅允许修改 title / description；roomId、startTime、endTime 必须与原值一致，
          否则 40909（此时服务端跳过时间与冲突校验）。
