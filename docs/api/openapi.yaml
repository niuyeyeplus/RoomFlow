components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        将 Access Token 放入请求头：`Authorization: Bearer <accessToken>`。
        未携带 / 签名无效 / 已被撤销（logout 或账号禁用后）→ 401 + code=40101；
        已过期 → 401 + code=40102（前端应调用 POST /api/auth/refresh 换新）。
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: 资源 ID
    PathAccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: 账号 ID
    QueryPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
      description: 页码，从 1 开始
    QuerySize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10
      description: 每页条数，最大 100
  responses:
    BadRequest:
      description: 参数校验失败（code=40001，data.fieldErrors 给出字段级错误）或请求格式错误（code=40002，如 JSON 解析失败 / 类型不匹配）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            code: 40001
            message: 参数校验失败
            data:
              fieldErrors:
                - field: startTime
                  message: 必须按 15 分钟对齐
    Unauthorized:
      description: 未认证或凭证无效（code=40101 未携带/无效/已撤销，40102 Token 过期，40103 用户名或密码错误，40104 Refresh Token 无效/过期/已撤销）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            code: 40101
            message: 未认证或 Token 无效
            data: null
    Forbidden:
      description: 已认证但无权限（code=40301 无权限，40302 账号已禁用）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            code: 40301
            message: 无权限执行该操作
            data: null
    NotFound:
      description: 资源不存在或对当前用户不可见（code=40401）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            code: 40401
            message: 资源不存在
            data: null
    Conflict:
      description: 业务规则冲突，code 取值见该端点 x-error-codes（40901–40909）与 README 错误码表
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            code: 40902
            message: 会议时间与该房间已有会议冲突
            data: null
    InternalError:
      description: 服务器内部错误（code=50000），响应不包含堆栈或内部细节
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            code: 50000
            message: 服务器内部错误
            data: null
  schemas:
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: 校验失败的字段名（JSON 字段路径）
        message:
          type: string
          description: 字段级错误信息（中文）
    ErrorResult:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: 非 0 业务错误码，见 README 错误码表
        message:
          type: string
          description: 人类可读错误信息（中文），不含敏感内部细节
        data:
          type: object
          nullable: true
          description: 通常为 null；code=40001 时携带 fieldErrors 字段级错误列表
          properties:
            fieldErrors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
    Result:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: 0=成功
        message:
          type: string
          description: 提示信息（中文），成功时为 success 或操作描述
        data:
          description: 业务数据，类型见各 ResultXxx 包装 schema；无数据操作时为 null
    ResultVoid:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              nullable: true
              description: 固定为 null
    ResultInt:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: integer
              format: int32
              description: 整数结果（如批量操作影响条数）
    ResultAuthTokenVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthTokenVO'
    ResultAccountVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AccountVO'
    ResultRoomVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RoomVO'
    ResultRoomVOList:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RoomVO'
    ResultRoomAvailabilityVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RoomAvailabilityVO'
    ResultMeetingVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MeetingVO'
    ResultMeetingDetailVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MeetingDetailVO'
    ResultPageMeetingVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PageMeetingVO'
    ResultParticipantVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ParticipantVO'
    ResultParticipantVOList:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ParticipantVO'
    ResultNotificationVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/NotificationVO'
    ResultPageNotificationVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PageNotificationVO'
    PageMeetingVO:
      type: object
      required:
        - records
        - total
        - page
        - size
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/MeetingVO'
        total:
          type: integer
          format: int64
          description: 满足筛选条件的总条数
        page:
          type: integer
          format: int32
          description: 当前页码（回显请求值）
        size:
          type: integer
          format: int32
          description: 每页条数（回显请求值）
    PageNotificationVO:
      type: object
      required:
        - records
        - total
        - page
        - size
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/NotificationVO'
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
    Role:
      type: string
      enum:
        - USER
        - ADMIN
    AccountVO:
      type: object
      description: 账号视图对象（脱敏，绝不含 password_hash）
      required:
        - id
        - username
        - role
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          maxLength: 50
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: integer
          format: int32
          enum:
            - 0
            - 1
          description: 1=正常，0=禁用
        createdAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9_]{3,50}$'
          description: 3–50 位，仅字母 / 数字 / 下划线；全局唯一
          example: alice
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: 明文密码（传输层保护），8–64 位，服务端 BCrypt 加密存储
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 64
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          description: 登录 / 注册 / 上次刷新时签发的 Refresh Token；成功刷新后旧值立即失效（轮换）
    AuthTokenVO:
      type: object
      required:
        - tokenType
        - accessToken
        - accessTokenExpiresIn
        - refreshToken
        - refreshTokenExpiresIn
      properties:
        tokenType:
          type: string
          enum:
            - Bearer
        accessToken:
          type: string
          description: 'JWT Access Token，放入 Authorization: Bearer 头'
        accessTokenExpiresIn:
          type: integer
          format: int64
          description: Access Token 有效期（秒，自签发起算；示例 1800，实际值以服务端配置为准）
        refreshToken:
          type: string
          description: Refresh Token，仅用于 POST /api/auth/refresh
        refreshTokenExpiresIn:
          type: integer
          format: int64
          description: Refresh Token 有效期（秒，自签发起算；30 天 = 2592000）
    Equipment:
      type: string
      enum:
        - PROJECTOR
        - WHITEBOARD
        - VIDEO_CONFERENCE
        - PHONE
      description: 固定设备选项：PROJECTOR=投影仪，WHITEBOARD=白板，VIDEO_CONFERENCE=视频会议，PHONE=电话
    RoomVO:
      type: object
      required:
        - id
        - name
        - location
        - capacity
        - equipment
        - enabled
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 100
        location:
          type: string
          maxLength: 200
          nullable: true
        capacity:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        equipment:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Equipment'
          description: 设备列表，可为空数组
        enabled:
          type: boolean
          description: true=启用可预约；false=停用（软删除，历史关联保留）
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateRoomRequest:
      type: object
      required:
        - name
        - capacity
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        location:
          type: string
          maxLength: 200
          nullable: true
        capacity:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        equipment:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Equipment'
          description: 省略或空数组表示无设备
    UpdateRoomRequest:
      type: object
      description: PUT 全量更新；location 省略视为 null，equipment 省略视为空数组；不含 enabled（走 status 端点）
      required:
        - name
        - capacity
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        location:
          type: string
          maxLength: 200
          nullable: true
        capacity:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        equipment:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Equipment'
    RoomStatusRequest:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: true=启用；false=停用（存在 ACTIVE 会议时拒绝，40907）
    TimeSlot:
      type: object
      description: 已占用时段，`[startTime, endTime)` 半开区间
      required:
        - meetingId
        - startTime
        - endTime
      properties:
        meetingId:
          type: integer
          format: int64
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
    RoomAvailabilityVO:
      type: object
      description: |-
        房间占用查询结果。occupiedSlots 为与查询日期范围有交集的 status=ACTIVE 会议时段，
        按 startTime 升序。空闲时段 = 查询范围（北京时间日历日 00:00–24:00）减去占用时段，由前端计算。
      required:
        - roomId
        - startDate
        - endDate
        - occupiedSlots
      properties:
        roomId:
          type: integer
          format: int64
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        occupiedSlots:
          type: array
          items:
            $ref: '#/components/schemas/TimeSlot'
    MeetingStatus:
      type: string
      enum:
        - ACTIVE
        - ENDED
        - CANCELLED
        - DELETED
      description: |-
        ACTIVE=有效（占用时段，未结束；含未开始与进行中）；
        ENDED=已结束（正常到期 endedEarly=false 或提前结束 endedEarly=true）；
        CANCELLED=已取消（保留可见）；
        DELETED=已逻辑删除（任何列表/详情不返回）
    MeetingStatusFilter:
      type: string
      enum:
        - ACTIVE
        - ENDED
        - CANCELLED
      description: 列表筛选允许的状态（DELETED 不可筛选）
    ParticipantVO:
      type: object
      required:
        - id
        - meetingId
        - accountId
        - username
        - isOrganizer
        - banned
        - joinedAt
        - leftAt
        - leaveReason
      properties:
        id:
          type: integer
          format: int64
        meetingId:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        username:
          type: string
          maxLength: 50
        isOrganizer:
          type: boolean
          description: 是否发起人（创建会议时自动写入 true）
        banned:
          type: boolean
          description: 是否被踢禁入；true 时 leaveReason 必为 KICKED
        joinedAt:
          type: string
          format: date-time
        leftAt:
          type: string
          format: date-time
          nullable: true
          description: null=有效参会中；非 null=已退出/被踢
        leaveReason:
          type: string
          enum:
            - USER_LEFT
            - KICKED
            - null
          nullable: true
          description: null=未退出；USER_LEFT=主动退出（可重新报名）；KICKED=被踢（banned=1，永久禁入）
    MeetingVO:
      type: object
      required:
        - id
        - title
        - description
        - roomId
        - roomName
        - organizerId
        - organizerUsername
        - startTime
        - endTime
        - status
        - endedEarly
        - participantCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          nullable: true
        roomId:
          type: integer
          format: int64
        roomName:
          type: string
          maxLength: 100
          description: 冗余房间名称快照（便于展示；房间改名后不保证回溯更新）
        organizerId:
          type: integer
          format: int64
        organizerUsername:
          type: string
          maxLength: 50
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/MeetingStatus'
        endedEarly:
          type: boolean
          description: 是否提前结束（仅 status=ENDED 时有意义）
        participantCount:
          type: integer
          format: int32
          minimum: 0
          description: 当前有效参会人数（leftAt 为 null 的记录数，含发起人）
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MeetingDetailVO:
      allOf:
        - $ref: '#/components/schemas/MeetingVO'
        - type: object
          required:
            - participants
          properties:
            participants:
              type: array
              items:
                $ref: '#/components/schemas/ParticipantVO'
              description: 全部参会记录（含已退出/被踢），按 joinedAt 升序
    CreateMeetingRequest:
      type: object
      required:
        - title
        - roomId
        - startTime
        - endTime
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          nullable: true
        roomId:
          type: integer
          format: int64
          minimum: 1
        startTime:
          type: string
          format: date-time
          description: '北京时间（+08:00）；不早于 now、不晚于 now+72h；15 分钟对齐'
        endTime:
          type: string
          format: date-time
          description: '北京时间（+08:00）；晚于 startTime；15 分钟对齐；时长 15min–24h；可超出 72h 窗口、允许跨天'
    UpdateMeetingRequest:
      type: object
      description: PUT 全量语义；description 省略视为 null。未开始的会议可改全部字段；已开始会议仅 title/description 可变，roomId/startTime/endTime 须与原值一致（否则 40909）
      required:
        - title
        - roomId
        - startTime
        - endTime
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          nullable: true
        roomId:
          type: integer
          format: int64
          minimum: 1
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
    NotificationType:
      type: string
      enum:
        - PARTICIPANT_JOINED
        - PARTICIPANT_LEFT
        - PARTICIPANT_KICKED
        - MEETING_ENDED
      description: |-
        通知类型与默认收件人（Open Questions 已批准默认值）：
        PARTICIPANT_JOINED=有人报名→发发起人；PARTICIPANT_LEFT=有人退出→发发起人；
        PARTICIPANT_KICKED=被踢→发被踢人；MEETING_ENDED=会议结束（含到期自动结束与提前结束）→发全体有效参会者。
        会议修改/取消/删除不产生通知。
    NotificationVO:
      type: object
      required:
        - id
        - type
        - title
        - content
        - meetingId
        - isRead
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
          maxLength: 200
        content:
          type: string
        meetingId:
          type: integer
          format: int64
          nullable: true
          description: 关联会议 ID，可空
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
