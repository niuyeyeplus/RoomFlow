spring:
  application:
    name: roomflow
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      # Authentication is handled by the JWT filter; suppress the default in-memory
      # user and its "generated security password" startup warning.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jackson:
    time-zone: Asia/Shanghai
  data:
    redis:
      timeout: 5s
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2.0
        default-requeue-rejected: false

roomflow:
  scheduler:
    # Meeting end sweep; ShedLock+Redis makes it single-executor across instances.
    enabled: true
    interval: 60s
    lock-at-most: PT5M
    # Held nearly one full interval so a second instance skips each cycle instead of
    # re-running a redundant (idempotent but wasted) sweep right after the winner releases.
    lock-at-least: PT50S

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
