# Production environment configuration
# All values are injected via environment variables; no secrets in this file.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # Injected via the ADMIN_PASSWORD_HASH env var (BCrypt hash generated
      # offline). No default: a missing value fails startup (fail-fast).
      admin-password-hash: ${ADMIN_PASSWORD_HASH}

app:
  cors:
    # Comma-separated origins via env var; empty means no cross-origin requests are allowed.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

roomflow:
  jwt:
    secret: ${ROOMFLOW_JWT_SECRET:${JWT_SECRET}}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:30d}

logging:
  level:
    root: WARN
    com.roomflow: INFO
