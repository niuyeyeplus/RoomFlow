spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:13306}/${DB_NAME:roomflow}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:roomflow}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:15673}
    username: ${RABBITMQ_USERNAME:roomflow}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:roomflow}
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # DEV-ONLY bootstrap credential (admin/Admin@123456) injected into
      # V2__seed_rooms.sql via ${admin-password-hash}. For local development only;
      # staging/prod inject their own hash via the ADMIN_PASSWORD_HASH env var
      # (no default -> startup fails fast when unset).
      admin-password-hash: "$2a$10$/WCWM/aD6u8salk.29S.LOcRrtVfWNw2fRg3DIMHiqyqpSXn/vNPm"

app:
  cors:
    # Local Vite dev server origins only.
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173

roomflow:
  jwt:
    # Dev-only placeholder secret for local development. Never use outside dev;
    # staging/prod fail to start unless ROOMFLOW_JWT_SECRET (or JWT_SECRET) is set.
    secret: ${ROOMFLOW_JWT_SECRET:${JWT_SECRET:dev-only-insecure-jwt-secret-do-not-use-in-prod-0000}}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:30d}

logging:
  level:
    com.roomflow: DEBUG
    org.springframework.security: DEBUG
