spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  flyway:
    enabled: false

roomflow:
  jwt:
    # Test-only fixed secret; never used outside the test suite.
    secret: test-only-jwt-secret-not-for-production-0123456789
    access-ttl: 15m
    refresh-ttl: 30d
  scheduler:
    # No Redis in the test profile: disable scheduling/ShedLock so the context needs no
    # RedisConnectionFactory. Integration tests (containers) run with scheduling enabled.
    enabled: false
