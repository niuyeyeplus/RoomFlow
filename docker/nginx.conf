server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (server-level, inherited by all locations that do not
    # declare their own add_header directives — including /api/ below).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Backend API reverse proxy.
    # The frontend image is built without VITE_API_BASE_URL, so axios calls
    # use origin-relative /api/** paths (see frontend/src/api/client.ts) and
    # hit this nginx. Backend controllers are mapped under /api/**
    # (e.g. @RequestMapping("/api/auth")), so proxy_pass WITHOUT a URI part
    # preserves the full /api/... path — do not add a trailing slash/path.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
