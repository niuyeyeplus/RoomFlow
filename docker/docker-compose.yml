services:
  mysql:
    image: mysql:8.4
    container_name: roomflow-mysql
    env_file: ../.env
    environment:
      MYSQL_DATABASE: ${DB_NAME:-roomflow}
      MYSQL_USER: ${DB_USERNAME:-roomflow}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roomflow-net

  redis:
    image: redis:8.2-alpine
    container_name: roomflow-redis
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - roomflow-net

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: roomflow-rabbitmq
    env_file: ../.env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-roomflow}
    ports:
      - "15672:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roomflow-net

  backend:
    image: ghcr.io/niuyeyeplus/roomflow-backend:${IMAGE_TAG:-latest}
    container_name: roomflow-backend
    env_file: ../.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-roomflow}
      DB_USERNAME: ${DB_USERNAME:-roomflow}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-roomflow}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - roomflow-net

  frontend:
    image: ghcr.io/niuyeyeplus/roomflow-frontend:${IMAGE_TAG:-latest}
    container_name: roomflow-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - roomflow-net

volumes:
  mysql-data:
  redis-data:

networks:
  roomflow-net:
    driver: bridge
