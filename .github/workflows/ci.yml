name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, 'chore/**', 'ci/**', 'feat/**']

permissions:
  contents: read

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      - name: Lint backend
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B spotless:check
          ./mvnw -B compile spotbugs:check

      - name: Test backend (unit tests + Testcontainers ITs via verify)
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean verify

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend-check-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npx eslint .

      - name: Check formatting
        working-directory: frontend
        run: npx prettier --check .

      - name: Typecheck frontend
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: Test frontend
        working-directory: frontend
        run: npx vitest run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-check-build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /tmp
          /tmp/gitleaks detect --redact --report-format=sarif --report-path=gitleaks-results.sarif --log-level=info
          echo "Gitleaks scan completed - no leaks found"

      - name: Upload Gitleaks SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif-report
          path: gitleaks-results.sarif
          if-no-files-found: warn

      - name: Download and verify OpenSCA-cli v3.0.11
        run: |
          set -e
          OPENSCA_VERSION="v3.0.11"
          OPENSCA_TARBALL="opensca-cli-${OPENSCA_VERSION}-linux-amd64.tar.gz"
          OPENSCA_URL="https://github.com/XmirrorSecurity/OpenSCA-cli/releases/download/${OPENSCA_VERSION}/${OPENSCA_TARBALL}"
          OPENSCA_SHA256="69eb3924a01340825643ea5ad6e3bff2fc1e76830cbe9dbb35a28fd842eed65b"

          curl -sSL "${OPENSCA_URL}" -o "${OPENSCA_TARBALL}"
          echo "${OPENSCA_SHA256}  ${OPENSCA_TARBALL}" | sha256sum -c -
          tar xzf "${OPENSCA_TARBALL}"
          chmod +x opensca-cli
          echo "OpenSCA-cli ${OPENSCA_VERSION} downloaded and checksum verified"

      - name: Run OpenSCA dependency scan
        env:
          OPENSCA_TOKEN: ${{ secrets.OPENSCA_TOKEN }}
        run: |
          set +e
          OPENSCA_ARGS=(-path .)
          if [ -n "$OPENSCA_TOKEN" ]; then
            OPENSCA_ARGS+=(-token "$OPENSCA_TOKEN")
          fi

          JSON_EXIT=0
          SARIF_EXIT=0
          ./opensca-cli "${OPENSCA_ARGS[@]}" -out opensca-report.json -log opensca-json.log || JSON_EXIT=$?
          ./opensca-cli "${OPENSCA_ARGS[@]}" -out opensca-report.sarif -log opensca-sarif.log || SARIF_EXIT=$?

          echo "OpenSCA json exit=${JSON_EXIT}, sarif exit=${SARIF_EXIT}"
          if [ "${JSON_EXIT}" -ne 0 ] || [ "${SARIF_EXIT}" -ne 0 ]; then
            echo "::error::OpenSCA found vulnerabilities (json=${JSON_EXIT}, sarif=${SARIF_EXIT}). See opensca-reports artifact."
            exit 1
          fi
          echo "OpenSCA scan completed - no vulnerabilities found"

      - name: Redact token from OpenSCA logs
        if: always()
        env:
          OPENSCA_TOKEN: ${{ secrets.OPENSCA_TOKEN }}
        run: |
          for logfile in opensca-json.log opensca-sarif.log; do
            if [ -f "$logfile" ]; then
              if [ -n "$OPENSCA_TOKEN" ]; then
                perl -i -pe "s/\Q$OPENSCA_TOKEN\E/***REDACTED***/g" "$logfile"
              fi
            fi
          done

      - name: Upload OpenSCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opensca-reports
          path: |
            opensca-report.json
            opensca-report.sarif
          if-no-files-found: warn

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

  docker-build-push:
    runs-on: ubuntu-latest
    needs: [security-scan]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/niuyeyeplus/roomflow-backend
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/niuyeyeplus/roomflow-frontend
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Output image digests
        run: |
          echo "Backend digest: ${{ steps.build-backend.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend digest: ${{ steps.build-frontend.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
