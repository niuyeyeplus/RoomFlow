name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, 'chore/**', 'ci/**', 'feat/**']

permissions:
  contents: read

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      - name: Lint backend
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B spotless:check
          ./mvnw -B compile spotbugs:check

      - name: Test backend
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean test

      - name: Generate JaCoCo coverage report
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B jacoco:report

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend-check-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npx eslint .

      - name: Check formatting
        working-directory: frontend
        run: npx prettier --check .

      - name: Typecheck frontend
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: Test frontend
        working-directory: frontend
        run: npx vitest run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-check-build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /tmp
          /tmp/gitleaks detect --redact --report-format=sarif --report-path=gitleaks-results.sarif --log-level=info
          echo "Gitleaks scan completed - no leaks found"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      - name: Backend dependency vulnerability scan
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        timeout-minutes: 30
        run: |
          chmod +x ./mvnw
          ./mvnw -B dependency:resolve
          ./mvnw -B org.owasp:dependency-check-maven:11.1.1:check -DfailBuildOnCVSS=9 -DnvdApiKey="$NVD_API_KEY"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

  docker-build-push:
    runs-on: ubuntu-latest
    needs: [security-scan]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/niuyeyeplus/roomflow-backend
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/niuyeyeplus/roomflow-frontend
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Output image digests
        run: |
          echo "Backend digest: ${{ steps.build-backend.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend digest: ${{ steps.build-frontend.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
